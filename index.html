<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join our Telegram channel</title>
  <meta name="description" content="Join our Telegram channel" />
  <meta property="og:title" content="Join our Telegram channel" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Full-screen page background: assets/page-bg.jpg -->
  <div class="backdrop" aria-hidden="true"></div>

  <!-- Pop-up -->
  <div class="overlay" id="overlay" hidden>
    <div class="popup" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="popup-title" aria-describedby="popup-text">
      <!-- Background picture layer: put your image at assets/popup-bg.jpg -->
      <div class="popup-bg" aria-hidden="true"></div>
      <div class="popup-shade" aria-hidden="true"></div>

      <button class="close" id="close" aria-label="Close">&times;</button>

      <div class="popup-content">

        <h1 id="popup-title">Join our Telegram channel</h1>
        <p id="popup-text">Fresh news, exclusive updates and the community — all in one place. Don't miss out!</p>

        <a class="cta" id="cta" href="https://t.me/wildejager" target="_blank" rel="noopener">
          <svg class="tg-glyph" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M9.78 15.27 9.6 19.3c.39 0 .56-.17.76-.37l1.83-1.75 3.79 2.78c.7.38 1.19.18 1.38-.64l2.5-11.73c.23-1.03-.37-1.43-1.05-1.18L3.64 10.08c-1 .39-.99.95-.17 1.2l3.76 1.17 8.73-5.5c.41-.27.79-.12.48.15"/></svg>
          <span>Open in Telegram</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>

        <button class="later" id="later">Maybe later</button>
      </div>
    </div>
  </div>

  <!-- Shown after the pop-up is closed -->
  <button class="reopen" id="reopen" hidden aria-label="Open Telegram invite">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
      <path d="M9.78 15.27 9.6 19.3c.39 0 .56-.17.76-.37l1.83-1.75 3.79 2.78c.7.38 1.19.18 1.38-.64l2.5-11.73c.23-1.03-.37-1.43-1.05-1.18L3.64 10.08c-1 .39-.99.95-.17 1.2l3.76 1.17 8.73-5.5c.41-.27.79-.12.48.15"/>
    </svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
